[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-maintenance"
version = "0.1.0"
description = "Offline predictive maintenance and safety decision-support system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
]

[project.scripts]
prism-train = "prism.ml.train:main"
prism-evaluate = "prism.ml.evaluate:main"
prism-infer = "prism.ml.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
